name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install Composer packages
        run: composer install --no-progress

      - name: Check coding standards
        run: vendor/bin/phpcs

      - name: Run tests
        run: vendor/bin/phpunit

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v4
      
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install composer packages
        run: composer install --no-progress

      - name: Install node for npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download the exact version
        run: npm ci

      - name: Run WordPress
        run: npx wp-env start

      - name: Show plugin folder
        run: npx wp-env run tests-cli ls wp-content/plugins

      - name: Run command
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/Relay-Core vendor/bin/phpunit -c phpunit-integration.xml.dist